<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>황선중의 포모도로</title>
<style>
:root{
  --page:#fff; --text:#37352f; --muted:rgba(55,53,47,.65); --line:rgba(55,53,47,.16); --hover:rgba(55,53,47,.08);
  --tint:#fbe4e4; --bar:#e03e3e; --accent:#2383e2; --accent-h:#0077d4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-mode="short"]{--tint:#dbeddb;--bar:#448361}
:root[data-mode="long"]{--tint:#d3e5ef;--bar:#337ea9}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#191919;--text:rgba(255,255,255,.81);--muted:rgba(255,255,255,.46);--line:rgba(255,255,255,.13);--hover:rgba(255,255,255,.08);--tint:#522e2a;--bar:#ff7369}
  :root:not([data-theme="light"])[data-mode="short"]{--tint:#2b593f;--bar:#4dab9a}
  :root:not([data-theme="light"])[data-mode="long"]{--tint:#1f4d6b;--bar:#529cca}
}
:root[data-theme="dark"]{--page:#191919;--text:rgba(255,255,255,.81);--muted:rgba(255,255,255,.46);--line:rgba(255,255,255,.13);--hover:rgba(255,255,255,.08);--tint:#522e2a;--bar:#ff7369}
:root[data-theme="dark"][data-mode="short"]{--tint:#2b593f;--bar:#4dab9a}
:root[data-theme="dark"][data-mode="long"]{--tint:#1f4d6b;--bar:#529cca}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Helvetica,"Apple Color Emoji",Arial,sans-serif;font-size:16px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:clamp(3rem,12vh,7rem) 1.5rem 3rem}
.icon{font-size:4.2rem;line-height:1;margin:0 0 .6rem}
h1.title{font-size:clamp(2rem,6vw,2.5rem);font-weight:700;line-height:1.2;margin:0 0 .4rem}
.sub{color:var(--muted);margin:0 0 1.6rem}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.tabs button{font:inherit;font-size:.95rem;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:.4rem .7rem;margin-bottom:-1px;border-radius:4px 4px 0 0;cursor:pointer;white-space:nowrap}
.tabs button:hover{background:var(--hover)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.callout{background:var(--tint);border-radius:6px;padding:1.6rem 1.5rem 1.4rem;transition:background .3s}
.time{font-weight:700;font-size:clamp(4.5rem,20vw,8rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:0 0 1.1rem}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:1.3rem}
.bar i{display:block;height:100%;width:0;background:var(--bar);transition:width .9s linear}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.row button{font:inherit;font-size:.95rem;color:var(--text);background:var(--page);border:1px solid var(--line);border-radius:4px;padding:.4rem .9rem;cursor:pointer;min-height:34px}
.row button:hover{background:var(--hover)}
.row button.main{background:var(--accent);border-color:transparent;color:#fff;font-weight:600;min-width:6.5rem}
.row button.main:hover{background:var(--accent-h)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.props{margin-top:1.6rem;border-top:1px solid var(--line)}
.prop{display:flex;align-items:center;gap:1rem;padding:.55rem .25rem;border-bottom:1px solid var(--line);font-size:.95rem}
.prop span:first-child{color:var(--muted);width:7rem;flex:none}
.checks{display:flex;gap:.35rem}
.checks i{width:16px;height:16px;border:2px solid var(--muted);border-radius:3px;position:relative}
.checks i.on{background:var(--accent);border-color:var(--accent)}
.checks i.on::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.hint{color:var(--muted);font-size:.85rem;margin-top:1.2rem}
@media (prefers-reduced-motion:reduce){.bar i,.callout{transition:none}}
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">🍅</div>
  <h1 class="title">황선중의 포모도로</h1>
  <p class="sub">25분 집중하고 5분 쉬어요.</p>

  <div class="tabs" role="tablist" aria-label="타이머 종류">
    <button role="tab" data-mode="focus" aria-selected="true">집중</button>
    <button role="tab" data-mode="short" aria-selected="false">짧은 휴식</button>
    <button role="tab" data-mode="long" aria-selected="false">긴 휴식</button>
  </div>

  <section class="callout">
    <p class="time" id="time">25:00</p>
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    <div class="row">
      <button class="main" id="toggle">시작</button>
      <button id="reset">초기화</button>
      <button id="skip">건너뛰기</button>
    </div>
  </section>

  <div class="props">
    <div class="prop"><span>현재 세트</span><span class="checks" id="checks" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
    <div class="prop"><span>오늘 완료</span><span id="count">0개</span></div>
  </div>
  <p class="hint">스페이스바로 시작하거나 멈출 수 있어요.</p>
</main>
<script>
(function(){
  var TOTAL={focus:1500,short:300,long:900};
  var root=document.documentElement,timeEl=document.getElementById('time'),
      prog=document.getElementById('prog'),toggleBtn=document.getElementById('toggle'),
      checks=document.querySelectorAll('#checks i'),countEl=document.getElementById('count'),
      tabs=document.querySelectorAll('.tabs button');
  var mode='focus',left=TOTAL.focus,running=false,endAt=0,timer=null,count=0,ctx=null;
  var today=new Date().toISOString().slice(0,10);

  try{var s=JSON.parse(localStorage.getItem('pomo')||'null');if(s&&s.date===today)count=s.count|0;}catch(e){}
  function save(){try{localStorage.setItem('pomo',JSON.stringify({date:today,count:count}));}catch(e){}}

  function fmt(n){var m=Math.floor(n/60),r=n%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
  function render(){
    timeEl.textContent=fmt(left);
    prog.style.width=((1-left/TOTAL[mode])*100)+'%';
    var names={focus:'집중',short:'짧은 휴식',long:'긴 휴식'};
    document.title=fmt(left)+' · '+names[mode];
    toggleBtn.textContent=running?'일시정지':'시작';
    root.setAttribute('data-mode',mode);
    tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.mode===mode);});
    var filled=mode==='long'?4:count%4;
    checks.forEach(function(d,i){d.className=i<filled?'on':'';});
    countEl.textContent=count+'개';
  }
  function stop(){running=false;clearInterval(timer);}
  function setMode(m){stop();mode=m;left=TOTAL[m];render();}
  function chime(){
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      [0,.25].forEach(function(d,i){
        var o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+d;
        o.frequency.value=i?880:660;o.connect(g);g.connect(ctx.destination);
        g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);
        o.start(t);o.stop(t+.4);
      });
    }catch(e){}
  }
  function finish(){
    var wasFocus=mode==='focus';
    chime();
    if(wasFocus){count++;save();}
    setMode(wasFocus?(count%4===0?'long':'short'):'focus');
  }
  function tick(){
    left=Math.max(0,Math.ceil((endAt-Date.now())/1000));
    if(left===0){finish();return;}
    render();
  }
  function start(){
    try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.resume)ctx.resume();}catch(e){}
    running=true;endAt=Date.now()+left*1000;
    clearInterval(timer);timer=setInterval(tick,250);render();
  }
  function toggle(){running?(stop(),render()):start();}

  toggleBtn.addEventListener('click',toggle);
  document.getElementById('reset').addEventListener('click',function(){setMode(mode);});
  document.getElementById('skip').addEventListener('click',function(){
    setMode(mode==='focus'?(count%4===3?'long':'short'):'focus');
  });
  tabs.forEach(function(t){t.addEventListener('click',function(){setMode(t.dataset.mode);});});
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle();}
  });
  render();
})();
</script>
</body>
</html>
